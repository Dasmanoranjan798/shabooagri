name: ShabooAgri Flutter CI/CD

on:
  push:
    branches: [ "master", "main" ]
    # Pushing a version tag (e.g. v0.8.16) builds all platforms AND publishes
    # them to a GitHub Release — see the `release` job below.
    tags: [ "v*" ]
  pull_request:
    branches: [ "master", "main" ]
  # Allow building the release artifacts (incl. the Windows installer) on any
  # branch on demand — used to produce ShabooAgri-Setup-x64.exe for publishing
  # without waiting for a merge to master. A manual run also publishes a
  # Release (versioned by pubspec) so the binaries are one-click downloadable.
  workflow_dispatch:

jobs:
  test:
    name: Analyze and Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build_android:
    name: Build Android APK
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: mobile-app/build/app/outputs/flutter-apk/app-release.apk

  build_windows:
    name: Build Windows App
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release
      # --- P2-4: package a proper user-facing installer instead of a loose zip ---
      # Flutter Windows apps dynamically link the MSVC runtime, so a clean
      # machine needs the VC++ 2015-2022 x64 Redistributable. Bundle the official
      # redist and let the Inno Setup installer run it silently only if missing,
      # so a normal user just downloads -> installs -> launches (no dev tools).
      - name: Download Visual C++ Redistributable (x64) to bundle
        run: Invoke-WebRequest -Uri https://aka.ms/vs/17/release/vc_redist.x64.exe -OutFile installer\windows\vc_redist.x64.exe
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build Windows installer
        shell: pwsh
        run: |
          $ver = ([regex]::Match((Get-Content pubspec.yaml -Raw), 'version:\s*([0-9]+\.[0-9]+\.[0-9]+)')).Groups[1].Value
          $src = "$PWD\build\windows\x64\runner\Release"
          $vc  = "$PWD\installer\windows\vc_redist.x64.exe"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & "$iscc" "/DMyAppVersion=$ver" "/DSourceDir=$src" "/DVcRedistPath=$vc" "/Oinstaller\windows\Output" installer\windows\shabooagri.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: mobile-app/installer/windows/Output/ShabooAgri-Setup-x64.exe

  build_macos_ios:
    name: Build macOS and iOS
    needs: test
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
      - run: flutter config --enable-macos-desktop --enable-ios
      - run: flutter pub get
      - name: Build macOS App
        run: flutter build macos --release
      - name: Zip macOS App
        run: ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/shabooagri_mobile.app shabooagri-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: mobile-app/shabooagri-macos.zip
      - name: Build iOS Unsigned
        run: flutter build ios --release --no-codesign
      - name: Zip iOS Runner
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app shabooagri-ios-unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ios-release-unsigned
          path: mobile-app/shabooagri-ios-unsigned.zip

  # Collect every platform's artifact, name them the way the website's
  # downloads/ folder expects, and publish a GitHub Release so the binaries
  # are one-click downloadable (no more digging into an Actions run to grab
  # the .exe/.zip by hand). Runs only on a manual dispatch or a v* tag — never
  # on ordinary branch pushes or PRs.
  release:
    name: Publish GitHub Release
    needs: [ build_android, build_windows, build_macos_ios ]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Read app version from pubspec
        id: ver
        run: |
          V=$(grep -E '^version:' mobile-app/pubspec.yaml | sed -E 's/version:\s*([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "App version: $V"
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Stage release assets with website filenames
        run: |
          mkdir -p release
          cp "artifacts/android-apk/app-release.apk"                    "release/shabooagri-v${{ steps.ver.outputs.version }}.apk"
          cp "artifacts/windows-installer/ShabooAgri-Setup-x64.exe"     "release/ShabooAgri-Setup-x64.exe"
          cp "artifacts/macos-release/shabooagri-macos.zip"            "release/shabooagri-macos.zip"
          cp "artifacts/ios-release-unsigned/shabooagri-ios-unsigned.zip" "release/shabooagri-ios-unsigned.zip"
          ls -la release
      - name: Publish / update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.ver.outputs.version }}
        run: |
          # Idempotent: create the release if the tag is new, else just
          # re-upload (clobber) the assets. Marked prerelease (preview builds).
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* \
              --title "ShabooAgri $TAG" \
              --notes "Automated build of $TAG — Android APK, Windows installer, macOS app, and unsigned iOS build. Drop these into platform-frontend/public/downloads/ and bump /api/app-version to publish." \
              --prerelease \
              --target "${{ github.sha }}"
          fi
